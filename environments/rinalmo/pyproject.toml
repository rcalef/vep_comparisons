[project]
name = "vep-comparisons-rinalmo-environment"
version = "0.1.0"
description = "Isolated inference environment for the pinned RiNALMo-giga scorer"
requires-python = ">=3.11,<3.12"
dependencies = [
    "flash-attn==2.6.3",
    "rinalmo @ git+https://github.com/lbcb-sci/RiNALMo.git@2c2c5c14a5ae609d8c560a5d9ca32e51e0288955",
    "setuptools==75.8.0",
    "torch==2.6.0",
]

[tool.uv]
package = false
preview-features = ["extra-build-dependencies"]

[tool.uv.extra-build-dependencies]
flash-attn = [
    { requirement = "torch", match-runtime = true },
    "packaging",
    "ninja",
]

[[tool.uv.dependency-metadata]]
name = "flash-attn"
version = "2.6.3"
requires-dist = ["torch", "einops", "packaging", "ninja"]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
