[project]
name = "vep-comparisons"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Robert Calef", email = "robert.calef@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "marimo>=0.23.16",
    "matplotlib>=3.11.1",
    "numpy>=2.5.1",
    "pandas>=3.0.5",
    "polars>=1.43.2",
    "pysam>=0.24.0",
    "seaborn>=0.13.2",
]

[project.scripts]
vep-comparisons = "vep_comparisons:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
